<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>OuterNet · Snowfall</title></head>
<body><header><div><small>OUTERNET / MIDTOWN <span id="art-status"></span></small><h1>Somewhere above the snow.</h1></div><span id="zoom-label">Fit</span></header>
<main id="stage"><canvas aria-label="Isometric pixel room with twelve model agents"></canvas></main>
<aside id="card" hidden></aside><div id="hover"></div>
<section id="editor" hidden>
<strong>Placement</strong>
<select id="edit-kind" aria-label="Edit layer"><option value="all">All layers</option><option value="furniture">All sprites</option><option value="city">City buildings</option><option value="lightLines">Light polylines</option><option value="spots">Spots</option><option value="paths">Paths / steps</option><option value="windows">Glass panes</option><option value="glows">Glow regions</option><option value="steam">Steam</option></select>
<select id="edit-object" aria-label="Selected object"></select>
<button id="new-polygon">Add object / path</button><button id="delete-object">Remove selected</button><button id="mirror" hidden>Flip</button><button id="duplicate" hidden>Duplicate</button>
<details><summary>Sprite palette</summary><select id="sprite-choice" aria-label="Sprite palette"></select><img id="sprite-preview" alt="Selected sprite"><button id="add-sprite">Add sprite from palette</button></details>
<div id="sprite-fields" hidden><label>Layer<select id="sprite-layer"><option value="object">Object</option><option value="floor">Floor (rug)</option><option value="city">City (behind room)</option></select></label><label>Whole-pixel scale<input id="sprite-scale" type="number" min="1" step="1"></label><label>Base line (source art pixels)<input id="base-line" type="number" min="0" step="1"></label></div>
<div id="floor-fields" hidden><label>Floor level<select id="floor-level"><option value="0">0 · Main / terrace</option><option value="-1">−1 · Sunken living</option></select></label></div>
<div id="spot-fields" hidden><label>Pose<select id="pose"><option>stand</option><option>sit</option><option>floor</option><option>lie</option></select></label><label>Facing<select id="facing"><option>left</option><option>right</option></select></label><input id="tags" aria-label="Spot tags" placeholder="comfy,game"><input id="group" aria-label="Game group" placeholder="Game group"></div>
<div id="attach-fields" hidden><label>Attach to sprite<select id="attach-sprite"></select></label></div>
<div id="line-fields" hidden><label>Light style<select id="line-style"><option value="string">String lights</option><option value="fairy">Fairy lights</option><option value="rgb">RGB strip</option></select></label><label><input id="line-enabled" type="checkbox"> Enabled</label></div>
<div id="path-fields" hidden><label>Path type<select id="path-type"><option value="walk">Same-floor walk</option><option value="steps">Steps between levels</option></select></label><select id="path-vertex" aria-label="Path vertex"></select><label>Vertex floor<select id="vertex-level"><option value="0">0 · Main</option><option value="-1">−1 · Sunken</option></select></label></div>
<div id="glow-fields" hidden><label>Glow style<select id="glow-style"><option value="lamp">Lamp</option><option value="fire">Fire</option><option value="tv">TV</option></select></label></div>
<span id="edit-status">Drag handles. Enter finishes paths and polygons; Esc cancels.</span>
</section>
<nav id="playback"><button id="play">Pause</button><select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="4">4×</option><option value="16">16×</option></select><label>Open log<input id="file" type="file" accept=".jsonl"></label><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="place">Place (P)</button><button id="export" hidden>Copy scene JSON</button><button id="export-layout" hidden>Copy layout JSON</button><span id="run">Loading…</span></nav>
<footer>Scroll: integer zoom · Drag: pan · Click a creature · P: placement · Esc: stop following</footer><script type="module" src="/src/main.js"></script></body></html>
