<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>OuterNet · Snowfall</title></head>
<body><header><div><small>OUTERNET / MIDTOWN</small><h1>Somewhere above the snow.</h1></div><span id="zoom-label">Fit</span></header>
<main id="stage"><canvas aria-label="Isometric pixel room with twelve model agents"></canvas></main>
<aside id="card" hidden></aside><div id="hover"></div>
<section id="editor" hidden><strong>Placement</strong><select id="edit-kind"><option value="all">All layers</option><option value="furniture">Furniture</option><option value="spots">Spots</option><option value="paths">Walk paths</option><option value="occluders">Occluders</option><option value="lights">Lights</option><option value="windows">Window / snow</option><option value="rgb">RGB</option><option value="steam">Steam</option></select><select id="edit-object"></select><button id="new-polygon">Add object</button><button id="delete-object">Delete selected</button><button id="mirror" hidden>Mirror</button><button id="duplicate" hidden>Duplicate</button><button id="add-twinkle" hidden>Add twinkle</button><div id="region-fields" hidden><label>Light color<input id="light-color" type="color"></label><label>Flicker multiplier<input id="light-flicker" type="number" min="0" step="0.1"></label></div><div id="spot-fields" hidden><select id="pose"><option>stand</option><option>sit</option><option>floor</option><option>lie</option></select><select id="facing"><option>left</option><option>right</option></select><input id="tags" aria-label="Spot tags" placeholder="comfy,game"><input id="group" aria-label="Game group" placeholder="Game group"></div><span id="edit-status">Drag vertices, centers and foot lines. Enter finishes a new polygon.</span></section>
<nav id="playback"><button id="play">Pause</button><select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="4">4×</option><option value="16">16×</option></select><label>Open log<input id="file" type="file" accept=".jsonl"></label><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="place">Place (P)</button><button id="export" hidden>Copy scene JSON</button><span id="run">Loading…</span></nav>
<footer>Scroll: integer zoom · Drag: pan · Click a creature · P: placement · Esc: stop following</footer><script type="module" src="/src/main.js"></script></body></html>
