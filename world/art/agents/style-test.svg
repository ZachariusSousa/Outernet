<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" shape-rendering="crispEdges">
  <rect width="800" height="240" fill="#1c2638"/>

  <!-- axolotl: notched block, three gill stubs per side, tail -->
  <g transform="translate(50 60)">
    <rect x="16" y="92" width="80" height="4" fill="#000" opacity="0.25"/>
    <rect x="88" y="72" width="32" height="8" fill="#f2a7bb"/>
    <g fill="#e57b9b">
      <rect x="0" y="32" width="16" height="8"/><rect x="-8" y="44" width="24" height="8"/><rect x="0" y="56" width="16" height="8"/>
      <rect x="96" y="32" width="16" height="8"/><rect x="96" y="44" width="24" height="8"/><rect x="96" y="56" width="16" height="8"/>
    </g>
    <g fill="#f2a7bb"><rect x="24" y="24" width="64" height="56"/><rect x="16" y="32" width="80" height="40"/></g>
    <g fill="#f2a7bb"><rect x="28" y="80" width="16" height="8"/><rect x="68" y="80" width="16" height="8"/></g>
    <g fill="#2a2230"><rect x="36" y="44" width="8" height="8"/><rect x="68" y="44" width="8" height="8"/></g>
  </g>

  <!-- moth: tall notched block, square wings with spots, antennae, hovers -->
  <g transform="translate(250 48)">
    <rect x="28" y="104" width="56" height="4" fill="#000" opacity="0.15"/>
    <g fill="#d8c08e">
      <rect x="-8" y="24" width="40" height="40"/><rect x="0" y="16" width="24" height="56"/>
      <rect x="80" y="24" width="40" height="40"/><rect x="88" y="16" width="24" height="56"/>
    </g>
    <g fill="#b89660"><rect x="4" y="36" width="8" height="8"/><rect x="100" y="36" width="8" height="8"/></g>
    <g fill="#b89660">
      <rect x="40" y="8" width="8" height="16"/><rect x="64" y="8" width="8" height="16"/>
      <rect x="32" y="0" width="8" height="8"/><rect x="72" y="0" width="8" height="8"/>
    </g>
    <g fill="#efe2c4"><rect x="32" y="24" width="48" height="68"/><rect x="24" y="32" width="64" height="52"/></g>
    <g fill="#2a2230"><rect x="40" y="48" width="8" height="8"/><rect x="64" y="48" width="8" height="8"/></g>
  </g>

  <!-- raccoon: notched block, ears, mask band, ringed tail -->
  <g transform="translate(450 60)">
    <rect x="16" y="92" width="80" height="4" fill="#000" opacity="0.25"/>
    <g>
      <rect x="96" y="56" width="8" height="12" fill="#9aa3ad"/><rect x="104" y="56" width="8" height="12" fill="#3f444d"/>
      <rect x="112" y="56" width="8" height="12" fill="#9aa3ad"/><rect x="120" y="56" width="8" height="12" fill="#3f444d"/>
    </g>
    <g fill="#9aa3ad"><rect x="24" y="12" width="16" height="12"/><rect x="72" y="12" width="16" height="12"/></g>
    <g fill="#9aa3ad"><rect x="24" y="24" width="64" height="56"/><rect x="16" y="32" width="80" height="40"/></g>
    <rect x="16" y="40" width="80" height="16" fill="#3f444d"/>
    <g fill="#eef0f3"><rect x="36" y="44" width="8" height="8"/><rect x="68" y="44" width="8" height="8"/></g>
    <g fill="#3f444d"><rect x="28" y="80" width="16" height="8"/><rect x="68" y="80" width="16" height="8"/></g>
  </g>

  <!-- beaver: wide notched block, ears, tooth, paddle tail -->
  <g transform="translate(650 60)">
    <rect x="12" y="92" width="88" height="4" fill="#000" opacity="0.25"/>
    <g fill="#5e3b26"><rect x="96" y="76" width="32" height="12"/><rect x="100" y="72" width="24" height="20"/></g>
    <g fill="#8a5530"><rect x="24" y="20" width="12" height="8"/><rect x="76" y="20" width="12" height="8"/></g>
    <g fill="#b0703f"><rect x="20" y="28" width="72" height="56"/><rect x="12" y="36" width="88" height="40"/></g>
    <g fill="#2a2230"><rect x="36" y="44" width="8" height="8"/><rect x="68" y="44" width="8" height="8"/></g>
    <rect x="52" y="60" width="8" height="12" fill="#f5efe2"/>
    <g fill="#8a5530"><rect x="28" y="84" width="16" height="8"/><rect x="68" y="84" width="16" height="8"/></g>
  </g>

  <g font-family="Georgia, serif" font-size="13" fill="#f3e3c3" text-anchor="middle" opacity="0.8">
    <text x="106" y="200">axolotl · LLaDA</text>
    <text x="306" y="200">moth · Dream</text>
    <text x="506" y="200">raccoon · Qwen</text>
    <text x="706" y="200">beaver · Gemma</text>
  </g>
</svg>
